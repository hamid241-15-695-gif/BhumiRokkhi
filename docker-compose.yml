name: bhumirokkhi-v4
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bhumirokkhi_v4
      POSTGRES_USER: bhumi
      POSTGRES_PASSWORD: local_demo_v4_change_me
    volumes:
      - v4_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhumi -d bhumirokkhi_v4"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bhumi:local_demo_v4_change_me@db:5432/bhumirokkhi_v4
      DEMO_OTP: "1234"
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  v4_postgres_data:
